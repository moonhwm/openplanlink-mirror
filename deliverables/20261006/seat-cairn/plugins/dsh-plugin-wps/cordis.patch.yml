# dsh-plugin-wps —— WPS 多维表格 MCP 接入
# 工具以 mcp__wps__<tool> 形式出现（共 4 个）。
# 必需环境变量：WPS_API_TOKEN / WPS_FILE_ID / WPS_SCRIPT_ID（缺失时该插件不注册工具，不影响 harness）
- insert:
    - id: mcp-wps
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: wps
        transport: stdio
        command: 'C:\Users\欧阳宏俊\.dsh\dsh-runtimes\dsh-primary-runtime\dependencies\node\bin\node.exe'
        args:
          - 'C:\Users\欧阳宏俊\.dsh\mcp-servers\launch.mjs'
          - 'wps'
        env:
          WPS_API_TOKEN: !!js (process.env.WPS_API_TOKEN ?? '')
          WPS_FILE_ID: !!js (process.env.WPS_FILE_ID ?? '')
          WPS_SCRIPT_ID: !!js (process.env.WPS_SCRIPT_ID ?? '')
        toolCallTimeoutMs: 60000
