<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ouya Atlas · 折叠归档书架</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon.ico" />
<link rel="stylesheet" href="assets/atlas.css">
</head>
<body>

<!-- 浮尘 -->
<div class="dust" id="dust" aria-hidden="true"></div>

<!-- 顶部：书签 + 书名 -->
<header class="masthead">
  <a href="/" style="position:absolute;top:10px;left:14px;font-size:12px;color:var(--dim,#6B7899);text-decoration:none;border:1px solid var(--line,rgba(255,255,255,.10));padding:4px 10px;border-radius:999px;">← OpenPlanLink 主站</a>
  <div class="ribbon">
    <div class="ribbon-tail"></div>
    <div class="ribbon-body">
      <span class="ribbon-mark">折叠归档</span>
      <span class="ribbon-sub">Folded Archive</span>
    </div>
  </div>
  <div class="title-block">
    <h1>Ouya Atlas</h1>
    <p class="owner" id="ownerLine">海平面下的花未眠Ouya</p>
  </div>
  <div class="shelf-meta">
    <div class="meta-item"><span class="k">书脊</span><span class="v" id="mBundle">–</span></div>
    <div class="meta-item"><span class="k">明细</span><span class="v" id="mItem">–</span></div>
    <div class="meta-item"><span class="k">更新</span><span class="v" id="mTime">–</span></div>
  </div>
</header>

<!-- 工具条 -->
<nav class="toolbar">
  <div class="seg" id="viewSeg">
    <button class="seg-btn is-on" data-view="shelf">书架</button>
    <button class="seg-btn" data-view="list">清单</button>
  </div>
  <label class="search">
    <input id="q" type="search" placeholder="搜书名 / 摘要 / 标签…" autocomplete="off">
  </label>
  <div class="tool-right">
    <button class="ghost-btn" id="expandAll">全部展开</button>
    <button class="ghost-btn" id="collapseAll">全部折叠</button>
  </div>
</nav>

<main class="stage">
  <!-- 书架 -->
  <section class="library" id="library">
    <div class="shelf-unit" id="shelfUnit"></div>
  </section>

  <!-- 右侧：抽出后的阅读台 -->
  <aside class="deck" id="deck" aria-live="polite">
    <div class="deck-empty">
      <div class="deck-empty-mark">◧</div>
      <p>从架上抽出一册<br><span class="tiny">书脊会立到灯下</span></p>
    </div>
  </aside>
</main>

<!-- 底部：归档 ETL -->
<footer class="etl" id="etl">
  <div class="etl-head">
    <span class="etl-title">归档管线 · Archive ETL</span>
    <span class="etl-note" id="etlNote">就绪</span>
  </div>
  <div class="etl-body">
    <div class="etl-line"><span>L0 活动层</span><div class="bar"><i style="--w:100%"></i></div><b id="etlL0">–</b></div>
    <div class="etl-line"><span>L1 索引层</span><div class="bar"><i style="--w:0%"></i></div><b id="etlL1">–</b></div>
    <div class="etl-line"><span>L2 封存层</span><div class="bar"><i style="--w:0%"></i></div><b id="etlL2">–</b></div>
  </div>
</footer>

<script src="data/shelf.js"></script>
<script src="assets/atlas.js"></script>
</body>
</html>
