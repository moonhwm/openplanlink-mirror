name: enable-pages
on:
  push:
    branches: [main]
permissions:
  pages: write
  contents: read
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" -d '{"source":{"branch":"main","path":"/"}}' || true
