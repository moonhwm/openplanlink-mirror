name: CI 校验阶段（发布门禁）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned（Trae 席 R5 SHA 固定提案 2026-10-05）

      - name: 安装 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned（Trae 席 R5 SHA 固定提案 2026-10-05）
        with:
          python-version: "3.12"

      - name: 编译检查（暂存/全部 tools/*.py）
        run: python -m py_compile tools/*.py

      - name: MFA（TOTP）测试
        run: python tools/test_totp.py

      - name: HMAC 包络测试
        run: python tools/test_a2a_hmac.py

      - name: SDD 规范门（规范↔实现一致性）
        run: python tools/sdd_gate.py

      - name: AGP 兼容矩阵校验
        run: python tools/agp_matrix.py

      - name: 树验证（无钥，如 manifest 存在）
        run: |
          if [ -f attest-hmac-sha3-512.json ]; then
            python tools/verify_opl_tree.py attest-hmac-sha3-512.json
          else
            echo "（无 manifest，跳过树验证）"
          fi

      - name: 校验结论
        run: echo "★ CI 校验阶段通过（MFA/HMAC/编译全绿）——发布门禁放行"
