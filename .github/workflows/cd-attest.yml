name: CD 交付证明与状态发布（attest → status）

# 依据：
#   主权人令「尽快开始基于 … CI/CD …」「相关成果实时上传 GitHub」
#   守藏席 DF-PATROL-20261006-SHOUCANG-09 §三：CI 已成（ci-verify.yml），CD 待补
#     建议串接：push → 构建 attest 哈希树 → 发布静态站
#   本席 DF-EFF-20261006-CAIRN-01 §八 改进项
#
# 设计纪律（承 Trae 席 R5「SHA 固定」提案与 Moon 席「禁 force」共识）：
#   1. 仅用仓库 CI 已在役且已钉扎的两个 Action（checkout / setup-python），不引入新依赖；
#   2. 不上传大体积二进制：attest-cd.json 仅作运行期产物，落 STATUS.md（小件）入仓留痕；
#   3. 自动提交带 [skip ci]，避免与 ci-verify 形成推送回环；
#   4. 推送前 rebase，**全程不使用 force**；
#   5. 无密钥环境亦可运行：未提供 OPL_TREE_KEY 时只出默克尔根并标「未签名」（不伪造 MAC）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 同一 ref 只保留最新一次：旧运行被顶掉时**不再回写陈旧 STATUS**（本轮实测教训：
  # d10b5d5 的 CD 运行被新推送顶成 cancelled，若其仍回写会与最新件错位）。
  group: cd-attest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attest:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned（Trae 席 R5 SHA 固定提案 2026-10-05）
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned（Trae 席 R5 SHA 固定提案 2026-10-05）
        with:
          python-version: "3.12"

      - name: 构建交付证明（SHA3-512 默克尔树 + 静态状态页）
        env:
          # 仓库机密可选：64 字节密钥的 hex；未配置则只出默克尔根（无签名）
          OPL_TREE_KEY: ${{ secrets.OPL_TREE_KEY }}
        run: |
          python tools/cd_attest.py --root . \
            --out attest-cd.json \
            --status STATUS.md \
            --html status/index.html
          echo "--- STATUS.md ---"
          cat STATUS.md

      - name: 写入运行摘要（便于审计追溯）
        run: |
          {
            echo "## CD 交付证明"
            echo ""
            cat STATUS.md
            echo ""
            echo "产物：attest-cd.json（本运行期生成，不随仓提交；可用 tools/verify_opl_tree.py 复算）"
            echo "静态状态页：status/index.html（自包含、无外部依赖、无脚本；启用 Pages 指向 /status 即发布）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 一致性复核（file_count ↔ files 数组）
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open('attest-cd.json', encoding='utf-8'))
          ok = d['file_count'] == len(d['files'])
          print('file_count =', d['file_count'], 'len(files) =', len(d['files']), '一致 =', ok)
          sys.exit(0 if ok else 1)
          PY

      - name: 提交 STATUS.md 与静态状态页（带 [skip ci]，禁 force）
        run: |
          if [ -z "$(git status --porcelain STATUS.md status/index.html)" ]; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git config user.name "opl-cd-bot"
          git config user.email "cd-bot@openplanlink.local"
          git add STATUS.md status/index.html
          git commit -m "cd: 刷新交付状态 STATUS.md + status/index.html [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: 双远端对账（无镜像凭据则显式告警，不静默）
        env:
          # 可选：镜像远端(gitcode)的推送令牌；未配置则跳过并告警
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ -n "${MIRROR_PUSH_TOKEN}" ]; then
            git remote add gitcode "https://oauth2:${MIRROR_PUSH_TOKEN}@gitcode.com/gcw_9rZbCP4R/openplanlink-mirror.git" 2>/dev/null || true
            git push gitcode HEAD:main
            echo "★ 已同步镜像远端 gitcode（HEAD=${HEAD_SHA}）"
          else
            echo "::warning title=双远端待对账::本次 CD 自动提交仅推送 origin（HEAD=${HEAD_SHA}）；"\
                 "镜像远端 gitcode 落后一个提交，须由下一次 push_gate 对账（或配置 secrets.MIRROR_PUSH_TOKEN 由本步同推）。"
          fi
