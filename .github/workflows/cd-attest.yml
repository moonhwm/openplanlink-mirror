name: CD 交付证明与状态发布（attest → status）

# 依据：
#   主权人令「尽快开始基于 … CI/CD …」「相关成果实时上传 GitHub」
#   守藏席 DF-PATROL-20261006-SHOUCANG-09 §三：CI 已成（ci-verify.yml），CD 待补
#     建议串接：push → 构建 attest 哈希树 → 发布静态站
#   本席 DF-EFF-20261006-CAIRN-01 §八 改进项
#
# 设计纪律（承 Trae 席 R5「SHA 固定」提案与 Moon 席「禁 force」共识）：
#   1. 仅用仓库 CI 已在役且已钉扎的两个 Action（checkout / setup-python），不引入新依赖；
#   2. 不上传大体积二进制：attest-cd.json 仅作运行期产物，落 STATUS.md（小件）入仓留痕；
#   3. 自动提交带 [skip ci]，避免与 ci-verify 形成推送回环；
#   4. 推送前 rebase，**全程不使用 force**；
#   5. 无密钥环境亦可运行：未提供 OPL_TREE_KEY 时只出默克尔根并标「未签名」（不伪造 MAC）。

on:
  push:
    branches: [main]
  schedule:
    # 兜底：每 30 分钟一次（即使推送触发被平台取消，状态页也会被刷新）
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# 不设并发组：实测 GitHub 对同组「排队中的」运行亦会取消（cancel-in-progress: false 并不能保证执行），
# 在推送密集的仓里会导致 CD 被饿死（本日实测：306f9a22 的运行被 cancelled）。
# 改为每次运行各自独立；对 status 分支的写入竞态由发布步的「重取重试」兜住。

jobs:
  attest:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned（Trae 席 R5 SHA 固定提案 2026-10-05）
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned（Trae 席 R5 SHA 固定提案 2026-10-05）
        with:
          python-version: "3.12"

      - name: 构建交付证明（SHA3-512 默克尔树 + 静态状态页）
        env:
          # 仓库机密可选：64 字节密钥的 hex；未配置则只出默克尔根（无签名）
          OPL_TREE_KEY: ${{ secrets.OPL_TREE_KEY }}
        run: |
          python tools/cd_attest.py --root . \
            --out attest-cd.json \
            --status STATUS.md \
            --html status/index.html
          echo "--- STATUS.md ---"
          cat STATUS.md

      - name: 写入运行摘要（便于审计追溯）
        run: |
          {
            echo "## CD 交付证明"
            echo ""
            cat STATUS.md
            echo ""
            echo "产物：attest-cd.json（本运行期生成，不随仓提交；可用 tools/verify_opl_tree.py 复算）"
            echo "静态状态页：status/index.html（自包含、无外部依赖、无脚本；启用 Pages 指向 /status 即发布）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 一致性复核（file_count ↔ files 数组）
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open('attest-cd.json', encoding='utf-8'))
          ok = d['file_count'] == len(d['files'])
          print('file_count =', d['file_count'], 'len(files) =', len(d['files']), '一致 =', ok)
          sys.exit(0 if ok else 1)
          PY

      - name: 发布状态到独立 status 分支（线性追加 + 竞态重试，force-free）
        run: |
          set -u
          git config user.name "opl-cd-bot"
          git config user.email "cd-bot@openplanlink.local"
          # 生成件先移出工作树，避免切分支时被覆盖
          mkdir -p /tmp/cdout/status
          cp STATUS.md /tmp/cdout/STATUS.md
          cp status/index.html /tmp/cdout/status/index.html

          ok=0
          for attempt in 1 2 3; do
            echo "--- 发布尝试 $attempt ---"
            if git ls-remote --exit-code --heads origin status >/dev/null 2>&1; then
              # 显式 refspec 写入跟踪引用，不依赖 checkout 配置的 refspec
              git fetch origin refs/heads/status:refs/remotes/origin/status
              git checkout -B status origin/status
              echo "基于既有 origin/status 追加（线性、force-free）"
            else
              git checkout --orphan status
              git rm -rf --cached . >/dev/null 2>&1 || true
              echo "首次创建 status 分支（orphan）"
            fi
            mkdir -p status
            cp /tmp/cdout/STATUS.md STATUS.md
            cp /tmp/cdout/status/index.html status/index.html
            git add -f STATUS.md status/index.html
            if git diff --cached --quiet; then
              echo "status 分支无变化（内容一致），无需提交"
              ok=1
              break
            fi
            git commit -m "cd: 刷新交付状态（源提交 ${GITHUB_SHA}）[skip ci]"
            if git push origin HEAD:status; then
              echo "★ 已发布到 origin/status（force-free）"
              ok=1
              break
            fi
            echo "推送被拒（并发），重新取基底后重试"
            git checkout -q "$GITHUB_SHA" -- . 2>/dev/null || true
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error title=status 发布失败::三次尝试均未成功（并发或权限），status 分支保持上一次良好状态"
            exit 1
          fi

      - name: 说明：main 与镜像远端不再被 CD 写入
        run: |
          {
            echo ""
            echo "### 发布位变更"
            echo "CD 自本版起**只写 \`status\` 分支**，不再回写 \`main\`："
            echo "- \`main\` 只保留坐席提交 → 消除「CD 自动提交 ↔ 坐席并发推送」导致的双远端分叉；"
            echo "- GitHub Pages 可将 Source 指向 \`status\` 分支根目录即可发布静态状态页；"
            echo "- attest-cd.json 仍仅作运行期产物，不入任何分支。"
          } >> "$GITHUB_STEP_SUMMARY"
