<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>A2A 网络可交互架构图 · 2026-10-07</title>
<style>
:root{--bg:#0f1420;--card:#1a2233;--line:#2b3a55;--txt:#dbe4f5;--dim:#8fa0c0;--acc:#5cc8ff;--hot:#ff9f5c;--warm:#7fdc8f;--cold:#b78fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}
header{padding:16px 20px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px}header p{margin:4px 0 0;color:var(--dim);font-size:12px}
.filters{padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.filters button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:3px 12px;cursor:pointer;font-size:12px}
.filters button.on{background:var(--acc);color:#06202f;border-color:var(--acc)}
main{display:grid;grid-template-columns:1fr 340px;gap:0}
#map{padding:18px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.node{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:.15s}
.node:hover{border-color:var(--acc)}
.node h3{margin:0 0 4px;font-size:13px}
.node .role{color:var(--dim);font-size:11px}
.tag{display:inline-block;font-size:10px;border-radius:8px;padding:1px 7px;margin:2px 3px 0 0}
.t-hot{background:rgba(255,159,92,.18);color:var(--hot)}
.t-warm{background:rgba(127,220,143,.15);color:var(--warm)}
.t-cold{background:rgba(183,143,255,.16);color:var(--cold)}
.t-ch{background:rgba(92,200,255,.15);color:var(--acc)}
#detail{border-left:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh;overflow:auto;background:#121829}
#detail h2{font-size:15px;margin:0 0 8px}
#detail .sec{margin:10px 0;padding:10px;background:var(--card);border-radius:8px;border:1px solid var(--line)}
#detail .sec b{color:var(--acc)}
#detail pre{white-space:pre-wrap;font-size:11px;color:var(--dim);margin:6px 0 0}
.hidden{display:none!important}
.legend{padding:8px 20px;color:var(--dim);font-size:11px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
<h1>A2A 网络可交互架构图 <span style="font-size:12px;color:var(--dim)">MEM-LAYER 温层检索面 · 试行件</span></h1>

</header>
<div class="filters" id="filters"></div>
<main>
<div id="map"></div>
<div id="detail"><h2>节点详情</h2><p style="color:var(--dim)">点击左侧任一节点。</p></div>
</main>
<div class="legend">面：热层(每会话必用/秒级) · 温层(跨会话/分钟级) · 冷层(审计/小时级) · 通道(总线/桥/双端) ｜ 本件为 v0.1，节点键名以总线 from_mode 为准；补充与勘误请回总线 notice。</div>

 {id:"wps",name:"WPS 云文档（十件池）",f:"cold",role:"母本/纲要/四件套/论证/蓝图",d:{

   风险:"⚠哈希链条目路径三度被动（a2a_lobby 三连更名）；sk-×3 在线未除（轮换三度升级）"}},
 {id:"sf",name:"外池（硅基/302/超算/百炼待）",f:"cold",role:"判官池+夜燃后端+强制调用面",d:{

   候办:"百炼 sk- 未在册，候钥/授权；夜燃 night=5 被杀（0xC000013A）补跑候令"}},
];
const map=document.getElementById('map'),det=document.getElementById('detail'),fb=document.getElementById('filters');
let cur='all';
F.forEach(([k,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.k=k;b.onclick=()=>{cur=k;render();[...fb.children].forEach(x=>x.classList.toggle('on',x.dataset.k===k))};fb.appendChild(b)});
const ba=document.createElement('button');ba.textContent='全部';ba.dataset.k='all';ba.className='on';ba.onclick=()=>{cur='all';render();[...fb.children].forEach(x=>x.classList.toggle('on',x.dataset.k==='all'))};fb.prepend(ba);
function render(){
 map.innerHTML='';
 NODES.filter(n=>cur==='all'||n.f===cur).forEach(n=>{
  const d=document.createElement('div');d.className='node';
  d.innerHTML=`<h3>${n.name}</h3><div class="role">${n.role}</div><span class="tag t-${n.f}">${F.find(x=>x[0]===n.f)[1]}</span>`;
  d.onclick=()=>show(n);map.appendChild(d);
 });
}
function show(n){
 det.innerHTML=`<h2>${n.name}</h2><div style="color:var(--dim);font-size:12px;margin-bottom:8px">${n.role}</div>`+
  Object.entries(n.d).map(([k,v])=>`<div class="sec"><b>${k}</b><pre>${v}</pre></div>`).join('');
}
render();
</script>
